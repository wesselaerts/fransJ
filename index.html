// ============================================================
// HELPERS — localStorage + Anthropic API direct call
// ============================================================
const STORAGE_KEYS = {
  user: "delf:user", progress: "delf:progress", writings: "delf:writings",
  apikey: "delf:apikey", model: "delf:model"
};
const defaultUser = { streak: 0, lastSession: null, totalSessions: 0 };
const defaultProgress = { grammar: {}, vocab: {}, essays: [], syntheses: [] };

function lsGet(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch (e) { return fallback; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

function loadState() {
  return {
    user: lsGet(STORAGE_KEYS.user, defaultUser),
    progress: lsGet(STORAGE_KEYS.progress, defaultProgress),
    writings: lsGet(STORAGE_KEYS.writings, []),
    apikey: localStorage.getItem(STORAGE_KEYS.apikey) || "",
    model: localStorage.getItem(STORAGE_KEYS.model) || "claude-sonnet-4-20250514"
  };
}
const saveUser = (u) => lsSet(STORAGE_KEYS.user, u);
const saveProgress = (p) => lsSet(STORAGE_KEYS.progress, p);
const saveWritings = (w) => lsSet(STORAGE_KEYS.writings, w);
const saveApikey = (k) => localStorage.setItem(STORAGE_KEYS.apikey, k);
const saveModel = (m) => localStorage.setItem(STORAGE_KEYS.model, m);

function todayKey() { return new Date().toISOString().slice(0, 10); }
function yesterdayKey() { const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().slice(0, 10); }
function updateStreak(user) {
  const t = todayKey();
  if (user.lastSession === t) return user;
  const newUser = { ...user };
  newUser.streak = user.lastSession === yesterdayKey() ? (user.streak || 0) + 1 : 1;
  newUser.lastSession = t;
  newUser.totalSessions = (user.totalSessions || 0) + 1;
  return newUser;
}

async function callClaude(systemPrompt, userMessage, maxTokens = 1500) {
  const apiKey = localStorage.getItem(STORAGE_KEYS.apikey);
  const model = localStorage.getItem(STORAGE_KEYS.model) || "claude-sonnet-4-20250514";
  if (!apiKey) throw new Error("Geen API-sleutel ingesteld. Ga naar Instellingen.");
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model,
      max_tokens: maxTokens,
      system: systemPrompt,
      messages: [{ role: "user", content: userMessage }]
    })
  });
  if (!response.ok) {
    const errBody = await response.json().catch(() => ({}));
    const msg = (errBody.error && errBody.error.message) || `HTTP ${response.status}`;
    throw new Error(msg);
  }
  const data = await response.json();
  if (!data.content) throw new Error("Geen antwoord van API");
  return data.content.map(b => b.text || "").join("\n");
}

        content: "Le discours sur la dépolitisation des jeunes est trompeur. Si l'abstention électorale des 18-34 ans atteint des records (60% au premier tour des dernières législatives), cela ne signifie pas qu'ils se désintéressent de la chose publique. Au contraire : les marches pour le climat, les mouvements #MeToo et Black Lives Matter, l'engagement associatif, le militantisme en ligne témoignent d'une mobilisation intense. La jeunesse ne croit plus aux partis traditionnels, jugés sclérosés et déconnectés. Elle privilégie l'action directe, la mobilisation thématique, l'expression sur les réseaux sociaux. Cette transformation est saine : elle reflète une démocratie qui se renouvelle, qui invente de nouvelles formes de citoyenneté plus horizontales, moins institutionnelles." },
      { title: "Document 2 — Un délitement démocratique inquiétant", source: "(Adapté du Figaro Magazine)",

  const grammarAccuracy = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0;
  const vocabDone = Object.keys(progress.vocab || {}).length;
  const essaysDone = (progress.essays || []).length;
  const synthesesDone = (progress.syntheses || []).length;

              <span className="font-bold text-orange-700">{user.streak || 0}</span>

      <Card className="p-5 bg-gradient-to-br from-rose-50 via-white to-pink-50 relative overflow-hidden">

        <div className="relative">

function WritingScreen({ progress, setProgress, writings, setWritings, onBack }) {
  const [mode, setMode] = useState(null);
  const [structureType, setStructureType] = useState("essai");
  const [prompt, setPrompt] = useState(null);
  const [text, setText] = useState("");
  const [feedback, setFeedback] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const wordCount = text.trim() ? text.trim().split(/\s+/).length : 0;

  const pickPrompt = (kind) => {
    const pool = kind === "essai" ? ESSAY_PROMPTS : SYNTHESE_PROMPTS;
    const doneIds = (kind === "essai" ? progress.essays : progress.syntheses).map(e => e.promptId);
    const undone = pool.filter(p => !doneIds.includes(p.id));
    const src = undone.length > 0 ? undone : pool;
    const p = src[Math.floor(Math.random() * src.length)];
    setPrompt(p); setMode(kind); setText(""); setFeedback(null); setError(null);
  };

  const submitForFeedback = async () => {
    setLoading(true); setError(null);
    try {
      const isSynthese = mode === "synthese";
      const sources = isSynthese ? prompt.texts.map(t => `${t.title}\n${t.content}`).join("\n\n") : "";
      const system = isSynthese
        ? `Je bent een ervaren DELF C1 corrector. Beoordeel een SYNTHÈSE (~220 mots, Frans, geen mening). Geef feedback in het NEDERLANDS (Franse voorbeelden in het Frans laten).
Structuur:
**Score globale**: x/25 met korte uitleg.
**Sterke punten** (2-3 puntjes).
**Verbeterpunten**: concreet, met *exacte fouten* uit de tekst tussen aanhalingstekens en correctie ernaast.
**Grammatica/spelling**: lijst van fouten met correctie.
**Vocabulaire/registre**: minstens 3 woordsuggesties (formeler/preciezer).
**Inhoudelijke check**: zegt de synthèse alleen wat in de bronnen staat? Wijst op kopieerfouten of weglatingen.
Streng (DELF C1 niveau) maar bemoedigend.`
        : `Je bent een ervaren DELF C1 corrector. Beoordeel een ESSAI ARGUMENTÉ (~250 mots, Frans). Feedback in het NEDERLANDS (Franse voorbeelden Frans).
Structuur:
**Score globale**: x/25 met uitleg.
**Sterke punten** (2-3).
**Structuur**: duidelijke intro, 2 argumenten + voorbeelden, conclusie?
**Grammatica/spelling**: lijst fouten + correcties (echte fouten uit de tekst, tussen aanhalingstekens).
**Vocabulaire/registre**: minstens 3 suggesties voor rijker C1-vocabulaire.
**Argumentatie**: zijn argumenten goed onderbouwd? Logische fouten of clichés?
Streng maar bemoedigend.`;

      const userMsg = isSynthese
        ? `OPDRACHT: ${prompt.consigne}\n\nBRONNEN:\n${sources}\n\nLEERLING TEKST (${wordCount} mots):\n${text}`
        : `OPDRACHT: ${prompt.prompt}\n\nLEERLING TEKST (${wordCount} mots):\n${text}`;

      const result = await callClaude(system, userMsg, 1800);
      setFeedback(result);
      const entry = { date: new Date().toISOString(), kind: isSynthese ? "synthese" : "essai", promptId: prompt.id, theme: prompt.theme, text, wordCount, feedback: result };
      const writingsArr = [entry, ...(writings || [])];
      setWritings(writingsArr); saveWritings(writingsArr);
      const newProgress = { ...progress };
      if (isSynthese) newProgress.syntheses = [entry, ...(progress.syntheses || [])];
      else newProgress.essays = [entry, ...(progress.essays || [])];
      setProgress(newProgress); saveProgress(newProgress);
    } catch (e) {
      setError("Er ging iets mis bij de feedback. Probeer opnieuw.");
    }
    setLoading(false);
  };

  // STRUCTURE VIEW
  if (mode === "structure") {
    const s = STRUCTURES[structureType];
    return (
      <div className="px-5 pt-3 pb-8 space-y-4">
        <BackButton onClick={() => setMode(null)} />
        <div className="flex bg-pink-50 p-1 rounded-2xl">
          {["essai", "synthese"].map(k => (
            <button key={k} onClick={() => setStructureType(k)} className={`flex-1 py-2 rounded-xl font-medium text-sm transition ${structureType === k ? "bg-white shadow text-pink-700" : "text-pink-500"}`}>
              {k === "essai" ? "Essai" : "Synthèse"}
            </button>
          ))}
        </div>
        <h2 className="text-2xl font-bold text-pink-950" style={{ fontFamily: "'Fraunces', serif" }}>{s.title}</h2>
        <Card className="p-4">
          <p className="text-sm text-pink-900/85 leading-relaxed" dangerouslySetInnerHTML={renderMd(s.intro)} />
        </Card>
        {s.parts.map((part, i) => (
          <Card key={i} className="p-4">
            <div className="flex items-center gap-2 mb-3">
              <div className="w-7 h-7 rounded-full bg-gradient-to-br from-pink-500 to-rose-500 text-white text-sm font-bold flex items-center justify-center shadow-sm">{i + 1}</div>
              <h3 className="font-semibold text-pink-950">{part.name}</h3>
            </div>
            <ul className="space-y-1.5 text-sm text-pink-900/85">
              {part.points.map((pt, j) => <li key={j} className="flex gap-2"><span className="text-pink-400 font-bold">→</span>{pt}</li>)}
            </ul>
          </Card>
        ))}
        <Card className="p-4 bg-gradient-to-br from-amber-50 to-rose-50 border-amber-100">
          <h3 className="font-semibold text-pink-950 mb-2 flex items-center gap-2">
            <Star className="w-4 h-4 text-amber-500" fill="currentColor" /> Belangrijke tips
          </h3>
          <ul className="space-y-2 text-sm text-pink-900/85">
            {s.tips.map((tip, j) => <li key={j} className="flex gap-2"><span className="text-amber-500">★</span><span dangerouslySetInnerHTML={renderMd(tip)} /></li>)}
          </ul>
        </Card>
        <div>
          <h3 className="font-semibold text-pink-950 mb-2 mt-2">Nuttige connecteurs C1</h3>
          <div className="space-y-2">
            {Object.entries(CONNECTEURS).map(([cat, list]) => (
              <Card key={cat} className="p-3">
                <div className="text-[10px] text-pink-500 font-bold uppercase tracking-widest mb-1">{cat}</div>
                <div className="text-sm text-pink-950 leading-relaxed">{list.join(" · ")}</div>
              </Card>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // HISTORY VIEW
  if (mode === "history") {
    return (
      <div className="px-5 pt-3 pb-8 space-y-4">
        <BackButton onClick={() => setMode(null)} />
        <h2 className="text-2xl font-bold text-pink-950" style={{ fontFamily: "'Fraunces', serif" }}>Geschreven werk</h2>
        {(writings || []).length === 0 ? (
          <Card className="p-6 text-center"><p className="text-sm text-pink-700/70">Nog niets geschreven.</p></Card>
        ) : writings.map((w, i) => (
          <Card key={i} className="p-4">
            <div className="flex items-center justify-between mb-2">
              <Pill color={w.kind === "essai" ? "rose" : "fuchsia"}>{w.kind === "essai" ? "Essai" : "Synthèse"}</Pill>
              <span className="text-xs text-pink-500">{new Date(w.date).toLocaleDateString("nl-NL", { day: "numeric", month: "short" })}</span>
            </div>
            <p className="text-xs text-pink-700/70 mb-2">{w.theme} · {w.wordCount} mots</p>
            <details className="text-sm">
              <summary className="cursor-pointer text-pink-700 font-medium">Bekijk tekst & feedback</summary>
              <div className="mt-3 space-y-3">
                <div>
                  <div className="text-[10px] text-pink-500 font-bold uppercase tracking-widest mb-1">Jouw tekst</div>
                  <p className="text-sm text-pink-900/85 whitespace-pre-wrap leading-relaxed">{w.text}</p>
                </div>
                <div>
                  <div className="text-[10px] text-pink-500 font-bold uppercase tracking-widest mb-1">Feedback</div>
                  <div className="text-sm text-pink-900/85 leading-relaxed" dangerouslySetInnerHTML={renderMd(w.feedback)} />
                </div>
              </div>
            </details>
          </Card>
        ))}
      </div>
    );
  }

  // WRITING ACTIVE
  if (mode && prompt) {
    const targetMin = mode === "synthese" ? 200 : 230;
    const targetMax = mode === "synthese" ? 240 : 270;
    const inRange = wordCount >= targetMin && wordCount <= targetMax;
    return (
      <div className="px-5 pt-3 pb-8 space-y-4">
        <BackButton onClick={() => { setMode(null); setPrompt(null); setText(""); setFeedback(null); }} />
        <div className="flex items-center justify-between">
          <Pill color="rose">{mode === "essai" ? "Essai argumenté" : "Synthèse"}</Pill>
          <Pill color="pink">{prompt.theme}</Pill>
        </div>
        {mode === "synthese" ? (
          <>
            <Card className="p-4 bg-pink-50/50">
              <div className="text-[10px] uppercase tracking-widest text-pink-500 font-bold mb-1">Consigne</div>
              <p className="text-sm text-pink-950 leading-relaxed">{prompt.consigne}</p>
            </Card>
            {prompt.texts.map((t, i) => (
              <Card key={i} className="p-4">
                <h4 className="font-semibold text-pink-950 mb-1">{t.title}</h4>
                <p className="text-xs text-pink-500 italic mb-2">{t.source}</p>
                <p className="text-sm text-pink-900/85 leading-relaxed">{t.content}</p>
              </Card>
            ))}
          </>
        ) : (
          <Card className="p-4 bg-pink-50/50">
            <div className="text-[10px] uppercase tracking-widest text-pink-500 font-bold mb-1">Sujet</div>
            <p className="text-sm text-pink-950 leading-relaxed">{prompt.prompt}</p>
          </Card>
        )}
        <div>
          <div className="flex items-center justify-between mb-2">
            <label className="text-sm font-semibold text-pink-900">Ton texte</label>
            <span className={`text-xs font-mono px-2 py-0.5 rounded-full ${inRange ? "bg-emerald-100 text-emerald-700" : wordCount > targetMax ? "bg-amber-100 text-amber-700" : "bg-pink-100 text-pink-600"}`}>
              {wordCount} / {targetMin}-{targetMax} mots
            </span>
          </div>
          <textarea
            value={text} onChange={(e) => setText(e.target.value)}
            placeholder={mode === "synthese" ? "Commence par présenter le thème commun aux deux documents..." : "Commence par une accroche, puis annonce ta thèse..."}
            className="w-full min-h-[320px] p-4 rounded-2xl border-2 border-pink-200 focus:border-pink-400 focus:outline-none text-pink-950 placeholder-pink-300 resize-y"
            style={{ fontSize: "15px", lineHeight: "1.6" }}
          />
        </div>
        {!feedback && (
          <PrimaryButton onClick={submitForFeedback} disabled={loading || wordCount < 80}>
            {loading
              ? <span className="flex items-center justify-center gap-2"><Loader2 className="w-5 h-5 animate-spin" /> Claude beoordeelt...</span>
              : wordCount < 80 ? "Schrijf eerst minstens 80 woorden" : "Vraag AI-feedback"}
          </PrimaryButton>
        )}
        {error && <p className="text-sm text-rose-600 text-center">{error}</p>}
        {feedback && (
          <>
            <Card className="p-4 bg-gradient-to-br from-white via-pink-50/30 to-rose-50/30">
              <div className="flex items-center gap-2 mb-3">
                <div className="w-8 h-8 rounded-2xl bg-gradient-to-br from-pink-500 to-rose-500 flex items-center justify-center">
                  <Sparkles className="w-4 h-4 text-white" />
                </div>
                <h3 className="font-bold text-pink-950">Feedback van Claude</h3>
              </div>
              <div className="text-sm text-pink-900/90 leading-relaxed" dangerouslySetInnerHTML={renderMd(feedback)} />
            </Card>
            <SecondaryButton onClick={() => pickPrompt(mode)} className="w-full">
              <span className="flex items-center justify-center gap-2"><RotateCcw className="w-4 h-4" /> Nieuwe opdracht</span>
            </SecondaryButton>
          </>
        )}
      </div>
    );
  }

  // MENU
  return (
    <div className="px-5 pt-3 pb-8 space-y-4">
      <BackButton onClick={onBack} />
      <h1 className="text-3xl font-bold text-pink-950" style={{ fontFamily: "'Fraunces', serif" }}>Schrijven</h1>
      <p className="text-pink-700/80 text-sm">Het DELF C1 vraagt om een <strong>essai argumenté</strong> en een <strong>synthèse</strong>. Schrijf, en krijg directe feedback van AI.</p>
      <button onClick={() => pickPrompt("essai")} className="w-full text-left">
        <Card className="p-5 active:scale-[0.99] transition">
          <div className="flex items-start gap-3">
            <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-pink-400 to-rose-400 flex items-center justify-center shadow-sm">
              <PenLine className="w-6 h-6 text-white" />
            </div>
            <div className="flex-1">
              <h3 className="font-bold text-pink-950 text-lg">Essai argumenté</h3>

// GRAMMAR SCREEN
// ============================================================
function GrammarScreen({ progress, setProgress, onBack }) {
  const [level, setLevel] = useState(null);
  const [topic, setTopic] = useState(null);
  const [exIdx, setExIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [showResult, setShowResult] = useState(false);
  const [sessionCorrect, setSessionCorrect] = useState(0);
  const [sessionTotal, setSessionTotal] = useState(0);
  const [done, setDone] = useState(false);
  const [showExplain, setShowExplain] = useState(false);

  const levels = ["A1", "A2", "B1", "B2", "C1"];

  if (topic && !done) {
    const ex = topic.exercises[exIdx];
    const isCorrect = selected === ex.answer;
    const isLast = exIdx === topic.exercises.length - 1;

    const handleAnswer = (idx) => {
      if (showResult) return;
      setSelected(idx); setShowResult(true);
      const correct = idx === ex.answer;
      setSessionTotal(s => s + 1);
      if (correct) setSessionCorrect(s => s + 1);
      const cur = progress.grammar[topic.id] || { attempts: 0, correct: 0 };
      const updated = { ...progress.grammar, [topic.id]: { attempts: cur.attempts + 1, correct: cur.correct + (correct ? 1 : 0), lastSeen: new Date().toISOString() } };
      const newProgress = { ...progress, grammar: updated };
      setProgress(newProgress); saveProgress(newProgress);
    };

    const next = () => {
      if (isLast) setDone(true);
      else { setExIdx(i => i + 1); setSelected(null); setShowResult(false); }
    };

    return (
      <div className="px-5 pt-3 pb-8 space-y-4">
        <div className="flex items-center justify-between">
          <BackButton onClick={() => { setTopic(null); setExIdx(0); setSelected(null); setShowResult(false); setSessionCorrect(0); setSessionTotal(0); setDone(false); setShowExplain(false); }} />
          <span className="text-sm text-pink-600 font-mono">{exIdx + 1} / {topic.exercises.length}</span>
        </div>
        <div className="h-1.5 bg-pink-100 rounded-full overflow-hidden">
          <div className="h-full bg-gradient-to-r from-pink-400 to-rose-500 transition-all duration-300" style={{ width: `${((exIdx + (showResult ? 1 : 0)) / topic.exercises.length) * 100}%` }} />
        </div>

        {/* Show grammar rule toggle */}
        {exIdx === 0 && (
          <Card className="p-4 bg-gradient-to-br from-pink-50/60 to-rose-50/60">
            <button onClick={() => setShowExplain(s => !s)} className="w-full flex items-center justify-between text-left">
              <div className="flex items-center gap-2">
                <BookOpen className="w-4 h-4 text-pink-500" />
                <span className="font-semibold text-pink-950">Theorie</span>
              </div>
              {showExplain ? <EyeOff className="w-4 h-4 text-pink-400" /> : <Eye className="w-4 h-4 text-pink-400" />}
            </button>
            {showExplain && (
              <p className="text-sm text-pink-900/85 leading-relaxed mt-3" dangerouslySetInnerHTML={renderMd(topic.nl)} />
            )}
          </Card>
        )}

        <Card className="p-5">
          <div className="text-[10px] text-pink-500 font-bold uppercase tracking-widest mb-2">{topic.title}</div>
          <p className="text-lg text-pink-950 font-medium leading-relaxed" style={{ fontFamily: "'Fraunces', serif" }}>{ex.q}</p>
        </Card>

        <div className="space-y-2.5">
          {ex.options.map((opt, idx) => {
            const isSelected = selected === idx;
            const isCorrectChoice = idx === ex.answer;
            let style = "bg-white border-pink-200 text-pink-950 active:bg-pink-50";
            if (showResult && isCorrectChoice) style = "bg-emerald-50 border-emerald-400 text-emerald-900";
            else if (showResult && isSelected && !isCorrectChoice) style = "bg-rose-50 border-rose-400 text-rose-900";
            else if (showResult) style = "bg-white border-pink-100 text-pink-700/60";
            return (
              <button key={idx} onClick={() => handleAnswer(idx)} disabled={showResult}
                className={`w-full flex items-center justify-between p-4 rounded-2xl border-2 transition text-left font-medium ${style}`}>
                <span>{opt}</span>
                {showResult && isCorrectChoice && <Check className="w-5 h-5 text-emerald-600" />}
                {showResult && isSelected && !isCorrectChoice && <X className="w-5 h-5 text-rose-600" />}
              </button>
            );
          })}
        </div>

        {showResult && (
          <Card className={`p-4 ${isCorrect ? "bg-emerald-50/60 border-emerald-200" : "bg-rose-50/60 border-rose-200"}`}>
            <div className="flex items-start gap-2">
              {isCorrect ? <Check className="w-5 h-5 text-emerald-600 mt-0.5" /> : <X className="w-5 h-5 text-rose-600 mt-0.5" />}
              <div className="flex-1">
                <p className={`font-semibold ${isCorrect ? "text-emerald-900" : "text-rose-900"}`}>
                  {isCorrect ? "Correct !" : "Niet helemaal"}
                </p>
                <p className="text-sm text-pink-900/85 mt-1">{ex.explain}</p>
              </div>
            </div>
          </Card>
        )}

        {showResult && <PrimaryButton onClick={next}>{isLast ? "Klaar" : "Volgende"}</PrimaryButton>}
      </div>
    );
  }

  if (topic && done) {
    const pct = Math.round((sessionCorrect / sessionTotal) * 100);
    return (
      <div className="px-5 pt-3 pb-8 space-y-5">
        <BackButton onClick={() => { setTopic(null); setDone(false); setSessionCorrect(0); setSessionTotal(0); setExIdx(0); }} />
        <Card className="p-6 text-center bg-gradient-to-br from-pink-50 via-white to-rose-50 relative overflow-hidden">
          <div className="absolute -top-10 -right-10 w-40 h-40 rounded-full bg-pink-200/30 blur-3xl pointer-events-none" />
          <div className="relative">
            <div className="w-16 h-16 mx-auto rounded-full bg-gradient-to-br from-pink-500 to-rose-500 flex items-center justify-center mb-3 shadow-lg shadow-pink-500/30">
              <Award className="w-8 h-8 text-white" />
            </div>
            <h2 className="text-3xl font-bold text-pink-950" style={{ fontFamily: "'Fraunces', serif" }}>Bravo !</h2>
            <p className="text-pink-700/80 mt-1">{topic.title}</p>
            <div className="mt-5 text-6xl font-bold text-pink-950" style={{ fontFamily: "'Fraunces', serif" }}>{pct}%</div>
            <p className="text-sm text-pink-700/70">{sessionCorrect} / {sessionTotal} correct</p>
          </div>
        </Card>
        <PrimaryButton onClick={() => { setDone(false); setExIdx(0); setSelected(null); setShowResult(false); setSessionCorrect(0); setSessionTotal(0); }}>
          <span className="flex items-center justify-center gap-2"><RotateCcw className="w-5 h-5" /> Opnieuw oefenen</span>
        </PrimaryButton>
        <SecondaryButton onClick={() => { setTopic(null); setDone(false); setSessionCorrect(0); setSessionTotal(0); setExIdx(0); }} className="w-full">
          Ander onderwerp
        </SecondaryButton>
      </div>
    );
  }

  if (level) {
    const topics = GRAMMAR.filter(g => g.level === level);
    return (
      <div className="px-5 pt-3 pb-8 space-y-4">
        <BackButton onClick={() => setLevel(null)} />
        <div>
          <div className="flex items-center gap-3 mb-1">
            <h1 className="text-3xl font-bold text-pink-950" style={{ fontFamily: "'Fraunces', serif" }}>Niveau {level}</h1>
            <Pill color={level === "C1" ? "fuchsia" : level === "B2" ? "rose" : "pink"}>{topics.length} onderwerpen</Pill>
          </div>
          <p className="text-sm text-pink-700/70">Tik een onderwerp om te oefenen.</p>
        </div>
        <div className="space-y-2.5">
          {topics.map((t) => {
            const stat = progress.grammar[t.id];
            const acc = stat && stat.attempts > 0 ? Math.round((stat.correct / stat.attempts) * 100) : null;
            return (
              <button key={t.id} onClick={() => { setTopic(t); setExIdx(0); setSelected(null); setShowResult(false); setSessionCorrect(0); setSessionTotal(0); setDone(false); setShowExplain(true); }} className="w-full text-left">
                <Card className="p-4 active:scale-[0.99] transition">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-pink-50 flex items-center justify-center">
                      <BookOpen className="w-5 h-5 text-pink-500" />
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="font-semibold text-pink-950 truncate">{t.title}</div>
                      <div className="text-xs text-pink-700/70 mt-0.5">
                        {t.exercises.length} oefeningen{acc !== null && ` · ${acc}% correct`}
                      </div>
                    </div>
                    {acc !== null && acc >= 80 && <Star className="w-4 h-4 text-amber-400" fill="currentColor" />}
                    <ChevronRight className="w-5 h-5 text-pink-300" />
                  </div>
                </Card>
              </button>
            );
          })}
        </div>
      </div>
    );
  }

  return (
    <div className="px-5 pt-3 pb-8 space-y-4">
      <BackButton onClick={onBack} />
      <h1 className="text-3xl font-bold text-pink-950" style={{ fontFamily: "'Fraunces', serif" }}>Grammatica</h1>
      <p className="text-sm text-pink-700/80">Kies een niveau. A1-A2 zijn snelle herhaling, B1+ is waar het gewicht ligt voor C1.</p>
      <div className="space-y-3">
        {levels.map(lv => {
          const topics = GRAMMAR.filter(g => g.level === lv);
          const totalAttempts = topics.reduce((a, t) => a + ((progress.grammar[t.id] || {}).attempts || 0), 0);
          const totalCorrect = topics.reduce((a, t) => a + ((progress.grammar[t.id] || {}).correct || 0), 0);
          const acc = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : null;
          const colors = {
            A1: "from-emerald-300 to-teal-400", A2: "from-teal-300 to-cyan-400",
            B1: "from-sky-300 to-pink-300", B2: "from-pink-400 to-rose-400", C1: "from-rose-500 to-fuchsia-500"
          };
          const labels = { A1: "Basis herhaling", A2: "Basis herhaling", B1: "Bouwsteen", B2: "Bouwsteen", C1: "Doel-niveau" };
          return (
            <button key={lv} onClick={() => setLevel(lv)} className="w-full text-left">
              <Card className="p-5 active:scale-[0.99] transition">
                <div className="flex items-center gap-4">
                  <div className={`w-14 h-14 rounded-2xl bg-gradient-to-br ${colors[lv]} flex items-center justify-center shadow-sm`}>
                    <span className="text-white font-bold text-lg" style={{ fontFamily: "'Fraunces', serif" }}>{lv}</span>
                  </div>
                  <div className="flex-1">
                    <div className="font-bold text-pink-950">{labels[lv]}</div>
                    <div className="text-xs text-pink-700/70 mt-0.5">{topics.length} onderwerpen{acc !== null && ` · ${acc}% correct`}</div>
                  </div>
                  <ChevronRight className="w-5 h-5 text-pink-300" />
                </div>
              </Card>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function VocabScreen({ progress, setProgress, onBack }) {
  const [theme, setTheme] = useState(null);
  const [mode, setMode] = useState(null);
  const [idx, setIdx] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [quizOptions, setQuizOptions] = useState([]);
  const [quizSelected, setQuizSelected] = useState(null);
  const [sessionCorrect, setSessionCorrect] = useState(0);
  const [sessionTotal, setSessionTotal] = useState(0);
  const [done, setDone] = useState(false);

  const markSeen = (themeId, wordIdx, correct = null) => {
    const key = `${themeId}:${wordIdx}`;
    const cur = progress.vocab[key] || { seen: 0, correct: 0, attempts: 0 };
    const upd = { ...progress.vocab, [key]: {
      seen: cur.seen + 1,
      correct: cur.correct + (correct === true ? 1 : 0),
      attempts: (cur.attempts || 0) + (correct !== null ? 1 : 0),
      lastSeen: new Date().toISOString()
    } };
    const np = { ...progress, vocab: upd };
    setProgress(np); saveProgress(np);
  };

  const startQuiz = (th) => {
    setTheme(th); setMode("quiz"); setIdx(0); setQuizSelected(null);
    setSessionCorrect(0); setSessionTotal(0); setDone(false);
    generateQuizOptions(th, 0);
  };

  const generateQuizOptions = (th, i) => {
    const correct = th.words[i];
    const pool = th.words.filter((_, j) => j !== i);
    const distractors = [];
    while (distractors.length < 3 && pool.length > 0) {
      distractors.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    }
    const all = [correct, ...distractors];
    for (let k = all.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      [all[k], all[j]] = [all[j], all[k]];
    }
    setQuizOptions(all);
  };

  // QUIZ done
  if (theme && mode === "quiz" && done) {
    const pct = Math.round((sessionCorrect / sessionTotal) * 100);
    return (
      <div className="px-5 pt-3 pb-8 space-y-5">
        <BackButton onClick={() => { setTheme(null); setMode(null); setDone(false); }} />
        <Card className="p-6 text-center bg-gradient-to-br from-pink-50 via-white to-rose-50">
          <div className="w-16 h-16 mx-auto rounded-full bg-gradient-to-br from-pink-500 to-rose-500 flex items-center justify-center mb-3 shadow-lg shadow-pink-500/30">
            <Award className="w-8 h-8 text-white" />
          </div>
          <h2 className="text-2xl font-bold text-pink-950" style={{ fontFamily: "'Fraunces', serif" }}>Bravo !</h2>
          <p className="text-pink-700/80 mt-1">{theme.theme}</p>
          <div className="mt-4 text-5xl font-bold text-pink-950" style={{ fontFamily: "'Fraunces', serif" }}>{pct}%</div>
          <p className="text-sm text-pink-700/70">{sessionCorrect} / {sessionTotal}</p>
        </Card>
        <PrimaryButton onClick={() => startQuiz(theme)}>
          <span className="flex items-center justify-center gap-2"><RotateCcw className="w-5 h-5" /> Opnieuw</span>
        </PrimaryButton>
        <SecondaryButton onClick={() => { setMode("flashcards"); setIdx(0); setRevealed(false); setDone(false); }} className="w-full">
          Bekijk flashcards
        </SecondaryButton>
      </div>
    );
  }

  // QUIZ active
  if (theme && mode === "quiz") {
    const word = theme.words[idx];
    const isLast = idx === theme.words.length - 1;
    const handleAnswer = (option) => {
      if (quizSelected !== null) return;
      setQuizSelected(option);
      const correct = option.fr === word.fr;
      setSessionTotal(s => s + 1);
      if (correct) setSessionCorrect(s => s + 1);
      markSeen(theme.id, idx, correct);
    };
    const nextQ = () => {
      if (isLast) setDone(true);
      else { setIdx(i => i + 1); setQuizSelected(null); generateQuizOptions(theme, idx + 1); }
    };
    return (
      <div className="px-5 pt-3 pb-8 space-y-4">
        <div className="flex items-center justify-between">
          <BackButton onClick={() => { setMode(null); setIdx(0); setQuizSelected(null); }} />
          <span className="text-sm text-pink-600 font-mono">{idx + 1} / {theme.words.length}</span>
        </div>
        <div className="h-1.5 bg-pink-100 rounded-full overflow-hidden">
          <div className="h-full bg-gradient-to-r from-pink-400 to-rose-500 transition-all" style={{ width: `${((idx + (quizSelected ? 1 : 0)) / theme.words.length) * 100}%` }} />
        </div>
        <Card className="p-6 text-center bg-gradient-to-br from-pink-50 to-rose-50">
          <div className="text-[10px] text-pink-500 font-bold uppercase tracking-widest mb-2">Welk Frans woord betekent</div>
          <p className="text-2xl font-bold text-pink-950 leading-tight" style={{ fontFamily: "'Fraunces', serif" }}>{word.nl}</p>
        </Card>
        <div className="space-y-2.5">
          {quizOptions.map((opt, j) => {
            const isCorrect = opt.fr === word.fr;
            const isSelected = quizSelected && quizSelected.fr === opt.fr;
            let style = "bg-white border-pink-200 text-pink-950 active:bg-pink-50";
            if (quizSelected && isCorrect) style = "bg-emerald-50 border-emerald-400 text-emerald-900";
            else if (quizSelected && isSelected) style = "bg-rose-50 border-rose-400 text-rose-900";
            else if (quizSelected) style = "bg-white border-pink-100 text-pink-700/60";
            return (
              <button key={j} onClick={() => handleAnswer(opt)} disabled={quizSelected !== null}
                className={`w-full flex items-center justify-between p-4 rounded-2xl border-2 transition text-left font-medium ${style}`}>
                <span>{opt.fr}</span>
                {quizSelected && isCorrect && <Check className="w-5 h-5 text-emerald-600" />}
                {quizSelected && isSelected && !isCorrect && <X className="w-5 h-5 text-rose-600" />}
              </button>
            );
          })}
        </div>
        {quizSelected && (
          <Card className="p-4 bg-pink-50/60">
            <p className="text-[10px] text-pink-500 font-bold uppercase tracking-widest mb-1">Voorbeeld</p>
            <p className="text-sm text-pink-950 italic">"{word.ex}"</p>
          </Card>
        )}
        {quizSelected && <PrimaryButton onClick={nextQ}>{isLast ? "Klaar" : "Volgende"}</PrimaryButton>}
      </div>
    );
  }

  // FLASHCARDS
  if (theme && mode === "flashcards") {
    const word = theme.words[idx];
    const isLast = idx === theme.words.length - 1;
    return (
      <div className="px-5 pt-3 pb-8 space-y-4">
        <div className="flex items-center justify-between">
          <BackButton onClick={() => { setMode(null); setIdx(0); setRevealed(false); }} />
          <span className="text-sm text-pink-600 font-mono">{idx + 1} / {theme.words.length}</span>
        </div>
        <div className="h-1.5 bg-pink-100 rounded-full overflow-hidden">
          <div className="h-full bg-gradient-to-r from-pink-400 to-rose-500 transition-all" style={{ width: `${((idx + 1) / theme.words.length) * 100}%` }} />
        </div>
        <button onClick={() => { if (!revealed) { setRevealed(true); markSeen(theme.id, idx); } }} className="w-full">
          <Card className="p-8 min-h-[280px] flex flex-col justify-center bg-gradient-to-br from-pink-50 via-white to-rose-50 cursor-pointer active:scale-[0.99] transition">
            <div className="text-[10px] text-pink-500 font-bold uppercase tracking-widest text-center mb-3">{theme.theme}</div>
            <p className="text-3xl font-bold text-pink-950 text-center leading-tight" style={{ fontFamily: "'Fraunces', serif" }}>{word.fr}</p>
            {revealed ? (
              <>
                <p className="text-lg text-pink-700 text-center mt-5 font-medium">{word.nl}</p>
                <div className="mt-4 p-3 bg-white/80 rounded-2xl">
                  <p className="text-sm text-pink-900/85 italic text-center">"{word.ex}"</p>
                </div>
              </>
            ) : (
              <p className="text-sm text-pink-400 text-center mt-6 flex items-center justify-center gap-1">
                <Eye className="w-4 h-4" /> Tik om vertaling te zien
              </p>
            )}
          </Card>
        </button>
        <div className="flex gap-2">
          <SecondaryButton onClick={() => { if (idx > 0) { setIdx(i => i - 1); setRevealed(false); } }} className="flex-1">
            <span className="flex items-center justify-center gap-1"><ChevronLeft className="w-4 h-4" /> Vorige</span>
          </SecondaryButton>
          <PrimaryButton onClick={() => { if (isLast) { setMode(null); setIdx(0); setRevealed(false); } else { setIdx(i => i + 1); setRevealed(false); } }} className="flex-1">
            {isLast ? "Klaar" : "Volgende"}
          </PrimaryButton>
        </div>
      </div>
    );
  }

  // THEME MENU
  if (theme && !mode) {
    return (
      <div className="px-5 pt-3 pb-8 space-y-4">
        <BackButton onClick={() => setTheme(null)} />
        <div>
          <h1 className="text-3xl font-bold text-pink-950" style={{ fontFamily: "'Fraunces', serif" }}>{theme.icon} {theme.theme}</h1>
          <p className="text-sm text-pink-700/70 mt-1">{theme.words.length} C1-woorden om te oefenen</p>
        </div>
        <button onClick={() => { setMode("flashcards"); setIdx(0); setRevealed(false); }} className="w-full text-left">
          <Card className="p-5 active:scale-[0.99] transition">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-pink-400 to-rose-400 flex items-center justify-center shadow-sm">
                <BookMarked className="w-6 h-6 text-white" />
              </div>
              <div className="flex-1">
                <h3 className="font-bold text-pink-950">Flashcards</h3>
                <p className="text-xs text-pink-700/70 mt-0.5">Bekijk woord + vertaling + voorbeeld</p>
              </div>
              <ChevronRight className="w-5 h-5 text-pink-300" />
            </div>
          </Card>
        </button>
        <button onClick={() => startQuiz(theme)} className="w-full text-left">
          <Card className="p-5 active:scale-[0.99] transition">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-rose-400 to-fuchsia-400 flex items-center justify-center shadow-sm">
                <Brain className="w-6 h-6 text-white" />
              </div>
              <div className="flex-1">
                <h3 className="font-bold text-pink-950">Quiz (NL → FR)</h3>
                <p className="text-xs text-pink-700/70 mt-0.5">Kies het juiste Franse woord</p>
              </div>
              <ChevronRight className="w-5 h-5 text-pink-300" />
            </div>
          </Card>
        </button>
        <div>
          <h3 className="text-[11px] font-bold text-pink-700/70 uppercase tracking-widest mt-4 mb-2 px-1">Woordenlijst</h3>
          <Card className="p-4 space-y-3">
            {theme.words.map((w, i) => (
              <div key={i} className="pb-3 border-b border-pink-100 last:border-0 last:pb-0">
                <div className="flex items-baseline justify-between gap-2">
                  <span className="font-semibold text-pink-950">{w.fr}</span>
                  <span className="text-xs text-pink-600 text-right">{w.nl}</span>
                </div>
                <p className="text-xs text-pink-700/70 italic mt-1">"{w.ex}"</p>
              </div>
            ))}
          </Card>
        </div>
      </div>
    );
  }

  // THEMES LIST
  return (
    <div className="px-5 pt-3 pb-8 space-y-4">
      <BackButton onClick={onBack} />
      <h1 className="text-3xl font-bold text-pink-950" style={{ fontFamily: "'Fraunces', serif" }}>Vocabulaire</h1>
      <p className="text-sm text-pink-700/80">12 thema's die het DELF C1 dekt. Leer per thema met flashcards en quiz.</p>
      <div className="grid grid-cols-2 gap-3">
        {VOCAB.map(th => {
          const seenCount = th.words.filter((_, i) => progress.vocab[`${th.id}:${i}`]).length;
          const pct = Math.round((seenCount / th.words.length) * 100);
          return (
            <button key={th.id} onClick={() => setTheme(th)} className="text-left">
              <Card className="p-4 active:scale-[0.99] transition h-full">
                <div className="text-3xl mb-2">{th.icon}</div>
                <h3 className="font-semibold text-pink-950 text-sm leading-tight">{th.theme}</h3>
                <div className="mt-3 h-1 bg-pink-100 rounded-full overflow-hidden">
                  <div className="h-full bg-gradient-to-r from-pink-400 to-rose-400" style={{ width: `${pct}%` }} />
                </div>
                <p className="text-[10px] text-pink-600 mt-1.5 font-medium">{seenCount}/{th.words.length} gezien</p>
              </Card>
            </button>
          );
        })}
      </div>
    </div>
  );
}
// ============================================================
// PROGRESS SCREEN
// ============================================================
function ProgressScreen({ user, progress, onBack }) {
  const levels = ["A1", "A2", "B1", "B2", "C1"];
  const grammarByLevel = levels.map(lv => {
    const topics = GRAMMAR.filter(g => g.level === lv);
    const totalAttempts = topics.reduce((a, t) => a + ((progress.grammar[t.id] || {}).attempts || 0), 0);
    const totalCorrect = topics.reduce((a, t) => a + ((progress.grammar[t.id] || {}).correct || 0), 0);
    return { level: lv, topics, totalAttempts, totalCorrect, acc: totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0 };
  });

  // Weak topics: <60% accuracy and >=3 attempts
  const weakTopics = GRAMMAR
    .map(t => ({ ...t, stat: progress.grammar[t.id] }))
    .filter(t => t.stat && t.stat.attempts >= 3 && (t.stat.correct / t.stat.attempts) < 0.6)
    .sort((a, b) => (a.stat.correct / a.stat.attempts) - (b.stat.correct / b.stat.attempts))
    .slice(0, 5);

  const strongTopics = GRAMMAR
    .map(t => ({ ...t, stat: progress.grammar[t.id] }))
    .filter(t => t.stat && t.stat.attempts >= 3 && (t.stat.correct / t.stat.attempts) >= 0.85)
    .slice(0, 5);

  const totalEssays = (progress.essays || []).length;
  const totalSyntheses = (progress.syntheses || []).length;
  const totalVocabSeen = Object.keys(progress.vocab || {}).length;
  const totalVocabAvailable = VOCAB.reduce((a, t) => a + t.words.length, 0);

  return (
    <div className="px-5 pt-3 pb-8 space-y-5">
      <BackButton onClick={onBack} />
      <h1 className="text-3xl font-bold text-pink-950" style={{ fontFamily: "'Fraunces', serif" }}>Voortgang</h1>

      {/* Streak + sessions */}
      <div className="grid grid-cols-2 gap-3">
        <Card className="p-4 bg-gradient-to-br from-orange-50 to-amber-50">
          <div className="flex items-center gap-1.5 text-orange-600 text-[10px] font-bold tracking-widest mb-1.5">
            <Flame className="w-3 h-3" fill="currentColor" /> STREAK
          </div>
          <div className="text-3xl font-bold text-pink-950">{user.streak || 0}</div>
          <div className="text-xs text-orange-700/70">dagen op rij</div>
        </Card>
        <Card className="p-4 bg-gradient-to-br from-pink-50 to-rose-50">
          <div className="flex items-center gap-1.5 text-pink-600 text-[10px] font-bold tracking-widest mb-1.5">
            <Calendar className="w-3 h-3" /> SESSIES
          </div>
          <div className="text-3xl font-bold text-pink-950">{user.totalSessions || 0}</div>
          <div className="text-xs text-pink-700/70">in totaal</div>
        </Card>
      </div>

      {/* Schrijven progress */}
      <Card className="p-4">
        <h2 className="font-bold text-pink-950 mb-3 flex items-center gap-2">
          <PenLine className="w-4 h-4 text-pink-500" /> Schrijven
        </h2>
        <div className="space-y-3">
          <div>
            <div className="flex items-baseline justify-between mb-1">
              <span className="text-sm text-pink-900">Essais</span>
              <span className="text-xs text-pink-600 font-mono">{totalEssays} / {ESSAY_PROMPTS.length}</span>
            </div>
            <div className="h-2 bg-pink-100 rounded-full overflow-hidden">
              <div className="h-full bg-gradient-to-r from-pink-400 to-rose-400" style={{ width: `${Math.min(100, (totalEssays / ESSAY_PROMPTS.length) * 100)}%` }} />
            </div>
          </div>
          <div>
            <div className="flex items-baseline justify-between mb-1">
              <span className="text-sm text-pink-900">Synthèses</span>
              <span className="text-xs text-pink-600 font-mono">{totalSyntheses} / {SYNTHESE_PROMPTS.length}</span>
            </div>
            <div className="h-2 bg-pink-100 rounded-full overflow-hidden">
              <div className="h-full bg-gradient-to-r from-rose-400 to-fuchsia-400" style={{ width: `${Math.min(100, (totalSyntheses / SYNTHESE_PROMPTS.length) * 100)}%` }} />
            </div>
          </div>
        </div>
      </Card>

      {/* Grammar by level */}
      <Card className="p-4">
        <h2 className="font-bold text-pink-950 mb-3 flex items-center gap-2">
          <BookOpen className="w-4 h-4 text-pink-500" /> Grammatica per niveau
        </h2>
        <div className="space-y-3">
          {grammarByLevel.map(g => {
            const colors = {
              A1: "from-emerald-300 to-teal-400", A2: "from-teal-300 to-cyan-400",
              B1: "from-sky-300 to-pink-300", B2: "from-pink-400 to-rose-400", C1: "from-rose-500 to-fuchsia-500"
            };
            return (
              <div key={g.level}>
                <div className="flex items-baseline justify-between mb-1">
                  <span className="text-sm font-semibold text-pink-900">{g.level}</span>
                  <span className="text-xs text-pink-600 font-mono">{g.totalAttempts > 0 ? `${g.acc}%` : "—"} · {g.totalAttempts} pogingen</span>
                </div>
                <div className="h-2 bg-pink-100 rounded-full overflow-hidden">
                  <div className={`h-full bg-gradient-to-r ${colors[g.level]}`} style={{ width: `${g.acc}%` }} />
                </div>
              </div>
            );
          })}
        </div>
      </Card>

      {/* Weak topics */}
      {weakTopics.length > 0 && (
        <Card className="p-4 bg-gradient-to-br from-rose-50/60 to-pink-50/60">
          <h2 className="font-bold text-pink-950 mb-3 flex items-center gap-2">
            <Target className="w-4 h-4 text-rose-500" /> Aandachtspunten
          </h2>
          <p className="text-xs text-pink-700/70 mb-3">Hier scoor je onder de 60% — extra oefenen!</p>
          <div className="space-y-2">
            {weakTopics.map(t => {
              const acc = Math.round((t.stat.correct / t.stat.attempts) * 100);
              return (
                <div key={t.id} className="flex items-center justify-between bg-white/70 p-3 rounded-2xl">
                  <div className="min-w-0 flex-1">
                    <div className="font-medium text-sm text-pink-950 truncate">{t.title}</div>
                    <div className="text-[10px] text-pink-500">{t.level}</div>
                  </div>
                  <div className="text-sm font-bold text-rose-600 font-mono">{acc}%</div>
                </div>
              );
            })}
          </div>
        </Card>
      )}

      {/* Strong topics */}
      {strongTopics.length > 0 && (
        <Card className="p-4 bg-gradient-to-br from-emerald-50/60 to-teal-50/60">
          <h2 className="font-bold text-pink-950 mb-3 flex items-center gap-2">
            <Star className="w-4 h-4 text-amber-500" fill="currentColor" /> Sterke punten
          </h2>
          <div className="space-y-2">
            {strongTopics.map(t => {
              const acc = Math.round((t.stat.correct / t.stat.attempts) * 100);
              return (
                <div key={t.id} className="flex items-center justify-between bg-white/70 p-3 rounded-2xl">
                  <div className="min-w-0 flex-1">
                    <div className="font-medium text-sm text-pink-950 truncate">{t.title}</div>
                    <div className="text-[10px] text-pink-500">{t.level}</div>
                  </div>
                  <div className="text-sm font-bold text-emerald-600 font-mono">{acc}%</div>
                </div>
              );
            })}
          </div>
        </Card>
      )}

      {/* Vocab */}
      <Card className="p-4">
        <h2 className="font-bold text-pink-950 mb-3 flex items-center gap-2">
          <Sparkles className="w-4 h-4 text-pink-500" /> Vocabulaire
        </h2>
        <div className="flex items-baseline justify-between mb-2">
          <span className="text-sm text-pink-900">Woorden gezien</span>
          <span className="text-xs text-pink-600 font-mono">{totalVocabSeen} / {totalVocabAvailable}</span>
        </div>
        <div className="h-2 bg-pink-100 rounded-full overflow-hidden">
          <div className="h-full bg-gradient-to-r from-fuchsia-400 to-pink-400" style={{ width: `${Math.min(100, (totalVocabSeen / totalVocabAvailable) * 100)}%` }} />
        </div>
        <div className="mt-4 grid grid-cols-2 gap-2">
          {VOCAB.map(th => {
            const seenCount = th.words.filter((_, i) => progress.vocab[`${th.id}:${i}`]).length;
            const pct = Math.round((seenCount / th.words.length) * 100);
            return (
              <div key={th.id} className="text-xs">
                <div className="flex items-baseline justify-between mb-0.5 gap-1">
                  <span className="text-pink-900 truncate">{th.icon} {th.theme.split(" ")[0]}</span>
                  <span className="text-pink-500 font-mono">{pct}%</span>
                </div>
                <div className="h-1 bg-pink-100 rounded-full overflow-hidden">
                  <div className="h-full bg-pink-400" style={{ width: `${pct}%` }} />
                </div>
              </div>
            );
          })}
        </div>
      </Card>

      <Card className="p-4 bg-gradient-to-br from-pink-50/60 to-amber-50/60 text-center">
        <p className="text-xs text-pink-700/70">Volgende streak-update bij sessie morgen 🌸</p>
      </Card>
    </div>
  );
}


// ============================================================
// MAIN APP
// ============================================================
function App() {
  const [screen, setScreen] = useState("home");
  const [user, setUser] = useState(defaultUser);
  const [progress, setProgress] = useState(defaultProgress);
  const [writings, setWritings] = useState([]);
  const [hasKey, setHasKey] = useState(false);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    const state = loadState();
    const newUser = updateStreak(state.user);
    setUser(newUser);
    setProgress(state.progress);
    setWritings(state.writings);
    saveUser(newUser);
    setHasKey(!!state.apikey);
    setLoaded(true);
  }, []);

  const navigate = (s) => {
    setScreen(s);
    if (typeof window !== "undefined") window.scrollTo({ top: 0, behavior: "smooth" });
  };

  if (!loaded) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-pink-50 to-rose-50">
        <div className="flex flex-col items-center gap-3">
          <Loader2 className="w-8 h-8 text-pink-500 animate-spin" />
          <p className="text-pink-600 text-sm">Chargement...</p>
        </div>
      </div>
    );
  }

  if (!hasKey) {
    return <SetupScreen onSave={() => setHasKey(true)} />;
  }

  return (
    <div className="min-h-screen bg-gradient-to-b from-pink-50/60 via-rose-50/30 to-white relative" style={{ fontFamily: "'Plus Jakarta Sans', system-ui, sans-serif" }}>
      <div className="fixed inset-0 pointer-events-none overflow-hidden">
        <div className="absolute -top-40 -right-20 w-80 h-80 rounded-full bg-gradient-to-br from-pink-200/30 to-rose-200/20 blur-3xl" />
        <div className="absolute -bottom-40 -left-20 w-96 h-96 rounded-full bg-gradient-to-tr from-fuchsia-200/20 to-pink-200/30 blur-3xl" />
      </div>

      <div className="relative max-w-md mx-auto pb-28">
        {screen === "home" && <HomeScreen user={user} progress={progress} onNavigate={navigate} />}
        {screen === "write" && <WritingScreen progress={progress} setProgress={setProgress} writings={writings} setWritings={setWritings} onBack={() => navigate("home")} />}
        {screen === "grammar" && <GrammarScreen progress={progress} setProgress={setProgress} onBack={() => navigate("home")} />}
        {screen === "vocab" && <VocabScreen progress={progress} setProgress={setProgress} onBack={() => navigate("home")} />}
        {screen === "progress" && <ProgressScreen user={user} progress={progress} onBack={() => navigate("home")} />}
        {screen === "settings" && <SettingsScreen onBack={() => navigate("home")} onKeyChanged={() => setHasKey(true)} />}
      </div>

      <div className="fixed bottom-0 left-0 right-0 z-40 safe-bottom">
        <div className="max-w-md mx-auto">
          <div className="mx-3 bg-white/90 backdrop-blur-xl rounded-3xl shadow-[0_-8px_32px_-8px_rgba(244,114,182,0.25)] border border-pink-100/80">
            <div className="grid grid-cols-5 px-2 py-2">
              {[
                { id: "home", I: Home, label: "Accueil" },
                { id: "write", I: PenLine, label: "Écrire" },
                { id: "grammar", I: BookOpen, label: "Gram." },
                { id: "vocab", I: Sparkles, label: "Vocab" },
                { id: "progress", I: TrendingUp, label: "Progrès" }
              ].map(tab => {
                const active = screen === tab.id;
                return (
                  <button key={tab.id} onClick={() => navigate(tab.id)}
                    className={`flex flex-col items-center justify-center gap-0.5 py-2 px-1 rounded-2xl transition ${active ? "bg-gradient-to-br from-pink-100 to-rose-100" : "active:bg-pink-50"}`}>
                    <tab.I className={`w-5 h-5 ${active ? "text-pink-600" : "text-pink-400"}`} strokeWidth={active ? 2.5 : 2} />
                    <span className={`text-[10px] font-semibold ${active ? "text-pink-700" : "text-pink-500"}`}>{tab.label}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
